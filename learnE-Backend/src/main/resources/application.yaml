spring:
  application:
    name: learnE-Backend

  datasource:
    url: jdbc:postgresql://localhost:5432/learne
    username: learne
    password: learne

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  web:
    error:
      include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytesmin}
    access-token-ttl-minutes: 1440
    refresh-token-ttl-days: 100
  cors:
    allowed-origins: http://localhost:5173

  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      # gemini-3.6-flash chỉ cho 20 request/ngày ở free tier nên không dùng làm mặc định.
      model: ${GEMINI_MODEL:gemini-3.5-flash}
      # Model nhẹ, quota free tier lớn hơn nhiều — dùng khi sinh từ vựng hàng loạt.
      bulk-model: ${GEMINI_BULK_MODEL:gemini-3.5-flash-lite}
      # Free tier tính quota riêng cho từng model, nên hết quota một model không được làm chết
      # tính năng. Client tự chuyển sang model kế tiếp; danh sách này là các model bổ sung, thử
      # sau `model` và `bulk-model`.
      fallback-models: ${GEMINI_FALLBACK_MODELS:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
