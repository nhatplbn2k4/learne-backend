services:
  postgres:
    image: postgres:16-alpine
    container_name: learne-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: learne
      POSTGRES_USER: learne
      POSTGRES_PASSWORD: learne
    ports:
      - "5432:5432"
    volumes:
      - learne-postgres-data:/var/lib/postgresql/data

volumes:
  learne-postgres-data:
